---
- name: Playbook with block
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Task before block
      debug:
        msg: "Before"
    - name: Block task
      block:
        - name: Task in block 1
          debug:
            msg: "Block 1"
        - name: Task in block 2
          debug:
            msg: "Block 2"
      tags: [block_tag]
    - name: Task after block
      debug:
        msg: "After"
