repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: true

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        pass_filenames: true

      - id: mypy
        name: mypy
        entry: uv run mypy src/ansible_aom
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: pytest
        name: pytest
        entry: uv run pytest tests/ -q --tb=short
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Bumps pyproject.toml [project].version based on the
      # conventional-commit type in the staged message:
      # feat → minor, fix/refactor/perf → patch, ! / BREAKING CHANGE
      # → major. Quietly no-ops for docs/chore/test/style and anything
      # not matching a conventional header. The hook is best-effort —
      # any failure leaves the original commit message intact.
      - id: bump-version
        name: bump-version
        entry: scripts/bump_version.py
        language: system
        stages: [commit-msg]
        always_run: true
        pass_filenames: true