repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: true

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        pass_filenames: true

      - id: mypy
        name: mypy
        entry: uv run mypy src/ansible_aom
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      # NOTE: pytest is intentionally NOT a pre-commit-framework hook.
      # The framework stashes tracked-but-not-untracked changes around
      # the whole hook run, which races concurrent agent sessions and
      # produces false failures (a session's untracked red TDD test
      # stays visible while its uncommitted fix gets stashed away).
      # The diff-aware pytest gate lives in .githooks/pre-push instead
      # (testmon selection against the committed state, execution
      # against the live tree, no framework stash).

      # NOTE: graphify is intentionally NOT a pre-commit framework hook.
      # The framework stashes-then-restores the working tree around its
      # pre-commit hooks, silently rolling back both the graphify-out
      # submodule commit and the gitlink `git add`. It runs instead as a
      # post-commit hook (.githooks/post-commit-graphify) installed by
      # scripts/install-hooks.sh, which amends the graphify pointer into
      # the commit that triggered it.

      - id: verify-anchors
        name: "verify design doc anchors (path:line-line) against the file system"
        entry: uv run python scripts/verify_anchors.py
        language: system
        # Forward the changed design doc(s) to the script as positional
        # arguments. Without ``pass_filenames: true`` the script would
        # be invoked with no docs and exit 2 with "at least one design
        # doc path is required". The ``files:`` regex below also
        # scopes the trigger: the hook only runs when a design doc
        # under ``docs/`` or ``.sisyphus/plans/`` is staged, and
        # only those filenames are forwarded.
        pass_filenames: true
        files: ^(docs/.*\.md|\.sisyphus/plans/.*\.md)$
        stages: [pre-commit]

      # NOTE: the version bumper is intentionally NOT registered here.
      # pre-commit framework stashes-then-restores unstaged files
      # around hook execution, which silently un-stages any
      # `git add` the bumper performs — the bump would land in the
      # NEXT commit instead of the one being written.
      #
      # Instead, install it as a direct git hook:
      #     ./scripts/install-hooks.sh
      # The bumper still runs from `scripts/bump_version.py` but bypasses
      # the framework's stash machinery so the new version lands in the
      # in-flight commit.