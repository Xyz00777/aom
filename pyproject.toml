[project]
name = "ansible-aom"
version = "0.94.2"
description = "Ansible Output Monitor - nom-style TUI for ansible-playbook"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Xyz00777", email = "git@paeiser.de"},
    {name = "Felix Karg", email = "f.karg10@gmail.com"},
]
requires-python = ">=3.14"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
    "textual>=0.60",
    "rich",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pexpect>=4.8",
    "psutil>=5.9",
    "argcomplete>=3.5",        # bash/zsh/fish tab-completion for the CLI
    "orjson>=3.10",            # Fast JSON parser on the PTY event hot path
]

[project.urls]
Homepage = "https://github.com/Xyz00777/aom"
Repository = "https://github.com/Xyz00777/aom"
Issues = "https://github.com/Xyz00777/aom/issues"
Documentation = "https://github.com/Xyz00777/aom/wiki"
Releases = "https://github.com/Xyz00777/aom/releases"

[project.scripts]
aom = "ansible_aom.cli:main"

[project.optional-dependencies]
dev = [
    "textual-dev>=0.86",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.8.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit>=3.0",
    "jsonschema>=4.20",        # schemas/run_summary.v1.json contract test
    "hypothesis>=6",           # property-based tests (Batch C)
    "pytest-testmon>=2.2",     # diff-aware test selection for the pre-push hook
]

integration = [
    "ansible-core>=2.16",
]

lint = [
    "ansible-lint>=24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ansible_aom"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-n auto --cov-fail-under=60"
testpaths = ["tests"]
markers = [
    "needs_ansible: requires real ansible-playbook + ansible.posix collection (auto-skipped otherwise)",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# F401: unused imports (test fixtures often import for side effects or future use)
# F811: redefinition of unused variable (local re-imports in test methods)
# F841: local variable assigned but never used (test scaffolding)
# E501: line too long (assertion messages with f-strings, inline JSON strings)
"tests/compact/test_mitogen_robustness.py" = ["F401"]
"tests/compact/test_password.py" = ["F401", "F841"]
"tests/compact/test_tree_render.py" = ["F401", "E501"]
"tests/compact/test_tree_upcoming_tasks.py" = ["F841"]
"tests/conftest.py" = ["F401"]
"tests/integration/test_compact_renderer.py" = ["F401", "F811", "F841"]
"tests/integration/test_error_handling.py" = ["F401", "F841"]
"tests/integration/test_playbook_parser.py" = ["F811", "F841"]
"tests/integration/test_runner_interactive_prompts.py" = ["E501"]
"tests/integration/test_r6_encoding_roundtrip.py" = ["E501"]
"tests/integration/test_session.py" = ["E501", "F401", "F841"]
"tests/tui/test_help_screen.py" = ["E501", "F401"]
"tests/tui/test_keybindings.py" = ["F401"]
"tests/tui/test_live_refresh.py" = ["F401"]
"tests/tui/test_panels.py" = ["F401", "F841"]
"tests/tui/test_tree_more_footers.py" = ["F401"]
"tests/unit/test_cli.py" = ["F401", "F841"]
"tests/unit/test_compact_pause_visibility.py" = ["F401"]
"tests/unit/test_config.py" = ["F401", "F811", "F841"]
"tests/unit/test_dynamic_counters.py" = ["E501"]
"tests/unit/test_dynamic_expansion.py" = ["F401"]
"tests/unit/test_event_processing.py" = ["F401"]
"tests/unit/test_include_cache.py" = ["E501", "F401"]
"tests/unit/test_inspect_model.py" = ["F401"]
"tests/unit/test_models.py" = ["E501", "F401", "F841"]
"tests/unit/test_parser.py" = ["F401", "F841"]
"tests/unit/test_play_boundary_state.py" = ["F401"]
"tests/unit/test_psutil_safe_probe.py" = ["F401"]
"tests/unit/test_pty_stream.py" = ["F401"]
"tests/unit/test_redaction.py" = ["E501", "F401"]
"tests/unit/test_runner_eof_watchdog.py" = ["E501", "F401"]
"tests/unit/test_runtime_role_task_count.py" = ["E501"]
"tests/unit/test_stderr_classifier.py" = ["E501", "F401"]
"tests/unit/test_template_variable_names.py" = ["F401"]
"tests/unit/test_tree_classify_and_role_labels.py" = ["E501", "F401", "F841"]
"tests/unit/test_tree_nested_roles.py" = ["E501"]
"tests/unit/test_tree_projection.py" = ["F401"]
"tests/unit/test_tree_ungrouped_roles.py" = ["E501", "F401", "F841"]
"tests/unit/test_warnings.py" = ["F401"]
"**/__init__.py" = ["F401"]
# Ansible callback plugins put DOCUMENTATION before imports by convention.
"src/ansible_aom/ansible/callback/*.py" = ["E402"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# The bundled ansible callback plugins subclass GPL ansible code that
# has no type stubs; they run inside the ansible subprocess, never imported
# by AOM, so strict typing buys nothing here.
module = "ansible_aom.ansible.callback.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# The connection-tracking callback plugin also subclasses ansible code
# and runs inside the subprocess.
module = "ansible_aom.callbacks.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# The vendored ansible collections (incl. ansible.posix.jsonl) ship no stubs.
module = "ansible_collections.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ansible_aom.compact.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "ansible_aom.tui.app"
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "ansible_aom.tui.screens.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "ansible_aom.tui.widgets.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "ansible_aom.inspect.display"
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pexpect ships no type stubs; we only use a thin slice of its API.
module = "pexpect.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ansible_aom.core.config"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "ansible.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ansible_module_utils.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "psutil"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "argcomplete.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ansible_aom.inspect.cli"
# argcomplete reads ``action.completer`` off argparse Action instances
# at runtime; the attribute isn't in argparse's type stubs.
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "ansible_aom.replay"
# argcomplete reads ``action.completer`` off argparse Action instances
# at runtime; the attribute isn't in argparse's type stubs.
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "ansible_aom.rerun.cli"
# argcomplete reads ``action.completer`` off argparse Action instances
# at runtime; the attribute isn't in argparse's type stubs.
disable_error_code = ["attr-defined"]
