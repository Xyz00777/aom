[project]
name = "ansible-aom"
version = "0.1.0"
description = "Ansible Output Monitor - nom-style TUI for ansible-playbook"
requires-python = ">=3.14"
dependencies = [
    "textual>=0.60",
    "rich",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "platformdirs>=3.0",
    "pexpect>=4.8",
    "psutil>=5.9",
    "blessed>=1.20",           # ANSI cursor positioning for compact mode
]

[project.scripts]
aom = "ansible_aom.cli:main"

[project.optional-dependencies]
dev = [
    "textual-dev>=0.86",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-textual-snapshot>=0.5",
    "pytest-cov",
    "ruff",
    "mypy",
    "inline-snapshot>=0.10",   # Compact mode snapshot testing
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ansible_aom"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true