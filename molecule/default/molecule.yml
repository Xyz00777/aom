---
# Molecule scenario for AOM test playbooks
# Uses local connection only - no containers/VMs needed

dependency:
  name: galaxy
  options:
    ignore-certs: true
    ignore-errors: true

driver:
  name: default

platforms: []
# No platforms needed - all test playbooks use ansible_connection=local

provisioner:
  name: ansible
  config_options:
    defaults:
      callback_enabled: ansible.posix.jsonl
      host_key_checking: false
      gathering: explicit
  inventory:
    links:
      hosts: ../../tests/playbooks/inventory.ini
  env:
    ANSIBLE_FORCE_COLOR: "0"
    ANSIBLE_STDOUT_CALLBACK: ansible.posix.jsonl

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - lint
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy