# CI workflow for ansible-aom
# Runs lint (ruff) → type-check (mypy) → test (pytest with xdist)
# on push to main/master and on every pull_request (incl. stacked PRs
# whose base is another feature branch).
#
# Uses uv for Python dependency management (matching the project's
# existing tooling). Python 3.14 only for AOM; a separate job tests supported
# ansible-core minor versions against the real-Ansible integration smoke tests.

name: CI

env:
  UV_LOCKED: "true"

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --all-extras --group release

      - name: Check software version bump
        run: uv run --no-sync python scripts/check_version_bump.py

      - name: Lint (ruff format check)
        run: uv run --no-sync ruff format --check src/

      - name: Lint (ruff check)
        run: uv run --no-sync ruff check src/

      - name: Type-check (mypy)
        run: uv run --no-sync mypy src/ansible_aom

      - name: Test (pytest with xdist)
        run: uv run --no-sync pytest tests/unit tests/compact tests/tui -q -n auto

      - name: Build distributions
        run: uv build --no-build-isolation

      - name: Validate distributions
        run: |
          uv run --no-sync twine check dist/*
          python -m venv /tmp/aom-ci-smoke
          /tmp/aom-ci-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/aom-ci-smoke/bin/aom --version
          /tmp/aom-ci-smoke/bin/aom --help >/dev/null
          /tmp/aom-ci-smoke/bin/python -c 'from pathlib import Path; import ansible_aom.ansible.runner as r; assert (Path(r.__file__).parent / "callback" / "aom_jsonl.py").is_file()'

  ansible-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible_core: ["2.20.*", "2.21.*"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install AOM and ansible-core ${{ matrix.ansible_core }}
        run: |
          uv sync --no-default-groups --group dev --no-install-project
          uv pip install -e . "ansible-core==${{ matrix.ansible_core }}"

      - name: Install ansible.posix callback collection
        run: uv run ansible-galaxy collection install ansible.posix

      - name: Show tested Ansible version
        run: uv run ansible-playbook --version

      - name: Run real-Ansible compatibility smoke tests
        run: uv run --no-sync pytest tests/integration/test_real_ansible.py -q

  nix:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Build Nix package
        run: nix build .#default --no-update-lock-file
      - name: Validate Nix package
        run: |
          ./result/bin/aom --version
          ./result/bin/aom --help >/dev/null
      - name: Evaluate development shell
        run: nix eval --raw .#devShells.x86_64-linux.default.drvPath --no-update-lock-file
