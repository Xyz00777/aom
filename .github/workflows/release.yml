name: Release

env:
  UV_LOCKED: "true"

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.evaluate.outputs.should_release }}
      tag: ${{ steps.evaluate.outputs.tag }}
      version: ${{ steps.evaluate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Evaluate release trigger
        id: evaluate
        run: python scripts/check_version_bump.py --check-release

  build:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
      - name: Validate tag and project version
        id: validate
        env:
          RELEASE_TAG: ${{ needs.check.outputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"invalid release tag: {tag!r}; expected vX.Y.Z")
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if tag[1:] != version:
              raise SystemExit(f"tag {tag} does not match project version {version}")
          print(f"Releasing ansible-aom {version} ({tag})")
          if "GITHUB_OUTPUT" in os.environ:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write(f"tag={tag}\n")
                  f.write(f"version={version}\n")
          PY
      - name: Install locked runtime and release tools
        run: uv sync --no-default-groups --group release --no-install-project
      - name: Build Python distributions
        run: uv build --no-build-isolation
      - name: Validate Python distributions
        run: |
          uv run --no-sync twine check dist/*
          python -m venv /tmp/aom-wheel-smoke
          /tmp/aom-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/aom-wheel-smoke/bin/aom --version
          /tmp/aom-wheel-smoke/bin/aom --help >/dev/null
          /tmp/aom-wheel-smoke/bin/python -c 'from pathlib import Path; import ansible_aom.ansible.runner as r; assert (Path(r.__file__).parent / "callback" / "aom_jsonl.py").is_file()'
      - name: Build Linux standalone bundle
        run: |
          uv pip install --no-deps dist/*.whl
          uv run --no-sync pyinstaller --clean --noconfirm --distpath build-dist --workpath build-work packaging/aom.spec
          test -x build-dist/aom/aom
          tar -C build-dist -czf dist/aom-linux-x86_64.tar.gz aom
      - name: Validate standalone bundle
        run: |
          test -f build-dist/aom/aom
          test -f build-dist/aom/_internal/ansible_aom/ansible/callback/aom_jsonl.py
          test -f build-dist/aom/_internal/ansible_aom/callbacks/aom_connection.py
          test -f build-dist/aom/_internal/ansible_aom/core/default_config.yaml
          build-dist/aom/aom --version
          build-dist/aom/aom --help >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error

  github-release:
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ needs.build.outputs.tag || needs.check.outputs.tag }}" dist/* --generate-notes --target "${{ github.sha }}"

  pypi:
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/ansible-aom
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: dist
      - name: Keep only Python distributions
        run: rm dist/aom-linux-x86_64.tar.gz
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
